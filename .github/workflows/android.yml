name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes list the PRs merged since the last release.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci

      # Identifies the Android side: tracked files under android/ plus the Capacitor
      # plugins. The app installs web-only updates (web.zip) when this matches its own.
      - name: Hash the Android code
        run: |
          plugins=$(node -p "Object.entries(require('./package.json').dependencies).filter(([k]) => k.startsWith('@cap')).join()")
          echo "VITE_NATIVE_HASH=$( (git ls-files -s android; echo "$plugins") | sha1sum | cut -c1-12)" >> "$GITHUB_ENV"
          echo "VITE_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      # .env is not committed: the FIREBASE_ENV repository secret holds the whole file
      # (same lines as .env.example). Stops here rather than shipping a build without sync.
      - name: Build web app
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          printf '%s\n' "$FIREBASE_ENV" | tr -d '\r' > .env
          grep -q '^VITE_FIREBASE_API_KEY=.' .env || { echo "::error::Add the FIREBASE_ENV repository secret (the contents of .env)"; exit 1; }
          npm run build
      - run: npx cap sync android
      - name: Zip the web files
        run: cd dist && zip -qr "$RUNNER_TEMP/web.zip" .

      # Optional private signing key; without it the committed debug key is used.
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/monthly-budget.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: monthly-budget-apk
          path: |
            ${{ runner.temp }}/monthly-budget.apk
            ${{ runner.temp }}/web.zip

      # main always replaces one release, so the download link never changes:
      # https://github.com/<owner>/<repo>/releases/latest/download/monthly-budget.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app reads "build N" from the title, and "native:" and the What's new lines
          # from the notes (src/data/appUpdate.ts, scripts/release-notes.mjs).
          PREV_BODY=$(gh release view android --json body -q .body 2>/dev/null || true) \
            BUILD=${{ github.run_number }} NATIVE=$VITE_NATIVE_HASH SHA=${{ github.sha }} \
            node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release delete android --yes --cleanup-tag || true
          gh release create android "$RUNNER_TEMP/monthly-budget.apk" "$RUNNER_TEMP/web.zip" \
            --title "Monthly Budget for Android (build ${{ github.run_number }})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "${{ github.sha }}" --latest
