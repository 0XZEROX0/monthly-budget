name: iPhone app

# Builds the iPhone app on one of GitHub's Macs, so no Mac is needed.
# On main, once the four Apple secrets below are in place, it signs the app and sends it
# to TestFlight, where testers get it as an update. Everywhere else (and on main before
# the secrets exist) it only checks that the app still builds.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID     10-character Team ID (developer.apple.com > Account > Membership details)
#   ASC_KEY_ID        App Store Connect API key ID (Users and Access > Integrations > Team Keys)
#   ASC_ISSUER_ID     Issuer ID shown above that list of keys
#   ASC_KEY_P8        the whole AuthKey_XXXX.p8 file, opened in a text editor and pasted in
# The key needs the Admin role so Xcode can create the signing certificate and profile itself.
# FIREBASE_ENV (the same secret the Android build uses) holds the app's Firebase config.

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    env:
      HAS_APPLE: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build web app
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
          VITE_BUILD: ${{ github.run_number }}
        run: |
          printf '%s\n' "$FIREBASE_ENV" | tr -d '\r' > .env
          grep -q '^VITE_FIREBASE_API_KEY=.' .env || { echo "::error::Add the FIREBASE_ENV repository secret (the contents of .env)"; exit 1; }
          npm run build
      - run: npx cap sync ios

      # Branches, pull requests, and main before the Apple secrets exist: just make sure it compiles.
      - name: Check the app builds (simulator, unsigned)
        if: github.ref != 'refs/heads/main' || env.HAS_APPLE != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet build
          if [ "$HAS_APPLE" != "true" ]; then
            echo "::notice::Built fine. Add the Apple secrets (see the top of ios.yml) to send builds to TestFlight."
          fi

      - name: Build, sign and upload to TestFlight
        if: github.ref == 'refs/heads/main' && env.HAS_APPLE == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD: ${{ github.run_number }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Team and build number go into the app target only (not the Swift packages).
          sed -i '' -e "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/" \
            -e "s/CURRENT_PROJECT_VERSION = 1;/CURRENT_PROJECT_VERSION = $BUILD;/" ios/App/App.xcodeproj/project.pbxproj

          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            "${AUTH[@]}" -quiet archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          # destination=upload sends the signed build straight to App Store Connect.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
          echo "::notice::Build $BUILD is uploaded. It shows up in TestFlight once Apple finishes processing it (usually 5 to 30 minutes)."
