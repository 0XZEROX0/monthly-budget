name: Galaxy Watch APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['wear/**', 'android/app/shared-debug.keystore', '.github/workflows/wear.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Same optional private key as the phone app; the two must be signed alike to link.
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: wear
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/monthly-budget-watch.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: monthly-budget-watch-apk
          path: ${{ runner.temp }}/monthly-budget-watch.apk

      # Its own release, so the phone app's "latest" download link keeps pointing at the phone APK:
      # https://github.com/<owner>/<repo>/releases/download/wear/monthly-budget-watch.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete wear --yes --cleanup-tag || true
          gh release create wear "$RUNNER_TEMP/monthly-budget-watch.apk" \
            --title "Monthly Budget for Galaxy Watch (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Install on a Wear OS watch with adb; see docs/watch.md." \
            --target "${{ github.sha }}" --latest=false
