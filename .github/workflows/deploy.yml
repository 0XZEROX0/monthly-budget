name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # .env is not committed: the FIREBASE_ENV repository secret holds the whole file
      # (same lines as .env.example). Stops here rather than shipping a build without sync.
      - name: Build web app
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          printf '%s\n' "$FIREBASE_ENV" | tr -d '\r' > .env
          grep -q '^VITE_FIREBASE_API_KEY=.' .env || { echo "::error::Add the FIREBASE_ENV repository secret (the contents of .env)"; exit 1; }
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
