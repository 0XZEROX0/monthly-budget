plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.monthlybudget.app'
    compileSdk = 36
    defaultConfig {
        // Same package and signing key as the phone app: the Wear OS Data Layer only
        // links apps that match, and that's how the phone hands over the sign-in.
        applicationId 'com.monthlybudget.app'
        minSdk 30
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '0')
    }
    signingConfigs {
        // Mirrors android/app/build.gradle so both apps carry the same signature.
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            storeFile ks ? file(ks) : file('../../android/app/shared-debug.keystore')
            storePassword ks ? System.getenv('ANDROID_KEYSTORE_PASSWORD') : 'android'
            keyAlias ks ? System.getenv('ANDROID_KEY_ALIAS') : 'androiddebugkey'
            keyPassword ks ? System.getenv('ANDROID_KEY_PASSWORD') : 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.wear.compose:compose-material:1.5.0'
    implementation 'androidx.wear.compose:compose-foundation:1.5.0'
    // Tile and complication
    implementation 'androidx.wear.tiles:tiles:1.5.0'
    implementation 'androidx.wear.protolayout:protolayout:1.3.0'
    implementation 'androidx.wear.protolayout:protolayout-material:1.3.0'
    implementation 'androidx.wear.protolayout:protolayout-expression:1.3.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.3.0'
    implementation 'com.google.guava:guava:33.4.8-android'
    // Sign-in from the phone app, and retrying entries made offline
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
}
